<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <!-- الهوية الأساسية -->
  <title>خدمة اجتماع بولس الرسول | خدمة الشباب</title>
  <meta name="description" content="منصة خدمة اجتماع بولس الرسول لإدارة الأعضاء والاجتماعات والحضور والافتقاد والرسائل.">
  <meta name="theme-color" content="#f8f1e6">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">

  <!-- الخط: تاجوال من جوجل مع بديل محلي في CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- التنسيقات -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- خريطة الاستيراد: Firebase محلي بالكامل (بلا CDN وقت التشغيل) -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "./vendor/firebase/firebase-app.js",
      "firebase/auth": "./vendor/firebase/firebase-auth.js",
      "firebase/firestore": "./vendor/firebase/firebase-firestore.js",
      "firebase/storage": "./vendor/firebase/firebase-storage.js",
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js": "./vendor/firebase/firebase-app.js"
    }
  }
  </script>
</head>
<body>

  <!-- شاشة الإقلاع -->
  <div id="boot" class="boot-splash" role="status" aria-live="polite">
    <div class="boot-inner">
      <img class="boot-logo" src="assets/icon.png" alt="شعار خدمة بولس الرسول" width="180" height="180">
      <div class="boot-name">خدمة اجتماع بولس الرسول</div>
      <div class="boot-tagline tagline">خدمة الشباب</div>
      <div class="boot-spinner" aria-hidden="true"></div>
    </div>
  </div>

  <!-- جذر التطبيق (يملأه الموجّه) -->
  <div id="app"></div>

  <!-- حاوية الإشعارات -->
  <div id="toasts" class="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <!-- مكتبات محلية كلاسيكية يجب تحميلها قبل وحدة التطبيق -->
  <script src="vendor/qrcode-generator.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/jsQR.js"></script>

  <!-- نقطة الدخول -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
