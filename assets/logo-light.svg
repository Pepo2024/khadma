<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 640 760" width="640" height="760" role="img"
     aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">شعار خدمة اجتماع بولس الرسول — نسخة فاتحة</title>
  <desc id="logoDesc">نسخة مناسبة للخلفيات الفاتحة: شعار بدرجات البيج والطين الدافئ مع كتاب مفتوح وصليب، وعبارة «بولس الرسول» و«خدمة الشباب».</desc>

  <defs>
    <radialGradient id="discL" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#7a5d47"/>
      <stop offset="55%" stop-color="#5c4433"/>
      <stop offset="100%" stop-color="#4a3629"/>
    </radialGradient>

    <linearGradient id="goldL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3d9b8"/>
      <stop offset="35%" stop-color="#d4a17d"/>
      <stop offset="70%" stop-color="#9c6348"/>
      <stop offset="100%" stop-color="#e6bc98"/>
    </linearGradient>

    <radialGradient id="haloL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2d5b2" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#d4a17d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pageL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="100%" stop-color="#efdcc3"/>
    </linearGradient>

    <filter id="shadowL" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3a2a1f" flood-opacity=".22"/>
    </filter>

    <line id="rayL" x1="0" y1="-136" x2="0" y2="-156"
          stroke="url(#goldL)" stroke-width="3" stroke-linecap="round"/>
    <line id="rayLongL" x1="0" y1="-132" x2="0" y2="-164"
          stroke="url(#goldL)" stroke-width="4" stroke-linecap="round"/>

    <path id="sparkL" d="M0,-11 Q1.8,-1.8 11,0 Q1.8,1.8 0,11 Q-1.8,1.8 -11,0 Q-1.8,-1.8 0,-11 Z"
          fill="url(#goldL)"/>
  </defs>

  <!-- القرص -->
  <g filter="url(#shadowL)">
    <circle cx="320" cy="300" r="192" fill="url(#discL)" stroke="url(#goldL)" stroke-width="8"/>
    <circle cx="320" cy="300" r="177" fill="none" stroke="#b9795b" stroke-width="1.6" opacity=".5"/>
    <circle cx="320" cy="300" r="167" fill="none" stroke="#d4a17d" stroke-width="1"
            stroke-dasharray="2 9" opacity=".4"/>

    <!-- الأشعة -->
    <g transform="translate(320 300)" opacity=".7">
      <use href="#rayL" xlink:href="#rayL"/>
      <use href="#rayL" xlink:href="#rayL" transform="rotate(30)"/>
      <use href="#rayL" xlink:href="#rayL" transform="rotate(60)"/>
      <use href="#rayL" xlink:href="#rayL" transform="rotate(90)"/>
      <use href="#rayL" xlink:href="#rayL" transform="rotate(120)"/>
      <use href="#rayL" xlink:href="#rayL" transform="rotate(150)"/>
      <use href="#rayL" xlink:href="#rayL" transform="rotate(180)"/>
      <use href="#rayL" xlink:href="#rayL" transform="rotate(210)"/>
      <use href="#rayL" xlink:href="#rayL" transform="rotate(240)"/>
      <use href="#rayL" xlink:href="#rayL" transform="rotate(270)"/>
      <use href="#rayL" xlink:href="#rayL" transform="rotate(300)"/>
      <use href="#rayL" xlink:href="#rayL" transform="rotate(330)"/>
      <g>
        <use href="#rayLongL" xlink:href="#rayLongL"/>
        <use href="#rayLongL" xlink:href="#rayLongL" transform="rotate(90)"/>
        <use href="#rayLongL" xlink:href="#rayLongL" transform="rotate(180)"/>
        <use href="#rayLongL" xlink:href="#rayLongL" transform="rotate(270)"/>
      </g>
    </g>

    <use href="#sparkL" xlink:href="#sparkL" transform="translate(172 300) scale(.8)"/>
    <use href="#sparkL" xlink:href="#sparkL" transform="translate(468 300) scale(.8)"/>

    <circle cx="320" cy="228" r="92" fill="url(#haloL)"/>

    <!-- الصليب -->
    <g>
      <rect x="311" y="154" width="18" height="172" rx="6" fill="url(#goldL)"/>
      <rect x="272" y="202" width="96" height="18" rx="6" fill="url(#goldL)"/>
      <rect x="315" y="158" width="4" height="160" rx="2" fill="#fff8ec" opacity=".45"/>
    </g>

    <!-- الكتاب المفتوح -->
    <g>
      <path d="M320 352 C292 334 254 330 214 338 L214 414 C254 406 292 410 320 428 Z"
            fill="url(#pageL)" stroke="url(#goldL)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M320 352 C348 334 386 330 426 338 L426 414 C386 406 348 410 320 428 Z"
            fill="url(#pageL)" stroke="url(#goldL)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M320 352 V428" stroke="#9c6348" stroke-width="3.5" stroke-linecap="round"/>
      <g stroke="#9c6348" stroke-width="2" stroke-linecap="round" opacity=".6" fill="none">
        <path d="M232 356 C260 351 286 354 306 363"/>
        <path d="M232 372 C260 367 286 370 306 379"/>
        <path d="M232 388 C260 383 286 386 306 395"/>
        <path d="M334 363 C354 354 380 351 408 356"/>
        <path d="M334 379 C354 370 380 367 408 372"/>
        <path d="M334 395 C354 386 380 383 408 388"/>
      </g>
    </g>
  </g>

  <!-- النصوص بلون كحلي لخلفية فاتحة -->
  <g opacity=".85">
    <path d="M158 552 H268" stroke="#b9795b" stroke-width="2" stroke-linecap="round"/>
    <path d="M372 552 H482" stroke="#b9795b" stroke-width="2" stroke-linecap="round"/>
    <path d="M320 544 L328 552 L320 560 L312 552 Z" fill="url(#goldL)"/>
  </g>

  <text x="320" y="626" text-anchor="middle" direction="rtl" unicode-bidi="embed"
        font-family="Tajawal, 'Segoe UI', Tahoma, Arial, sans-serif"
        font-size="68" font-weight="800" fill="#6b5140">بولس الرسول</text>

  <text x="320" y="688" text-anchor="middle" direction="rtl" unicode-bidi="embed"
        font-family="Tajawal, 'Segoe UI', Tahoma, Arial, sans-serif"
        font-size="32" font-weight="500" fill="#835840">خدمة الشباب</text>

  <g opacity=".75">
    <circle cx="320" cy="722" r="3" fill="#b9795b"/>
    <circle cx="305" cy="722" r="2" fill="#d4a17d"/>
    <circle cx="335" cy="722" r="2" fill="#d4a17d"/>
  </g>
</svg>
